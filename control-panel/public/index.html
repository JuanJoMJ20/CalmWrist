<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CalmWrist — Panel de control</title>
<style>
  :root {
    --bg: #050607;
    --surface: #14181c;
    --surface-glow: #1b2124;
    --text-primary: #f5f7f8;
    --text-secondary: #a7b0b8;
    --danger: #ff6b57;
    --calm: #63e6cb;
    --elevated: #ffd166;
    --crisis: #ffb020;
    --calm-glow: #123832;
    --elevated-glow: #3a2e10;
    --crisis-glow: #3a2408;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(ellipse 900px 500px at 20% -10%, var(--calm-glow), transparent 60%),
      radial-gradient(ellipse 900px 500px at 100% 10%, var(--crisis-glow), transparent 60%),
      var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    padding: 28px 20px 60px;
  }

  .wrap { max-width: 880px; margin: 0 auto; }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 28px;
  }

  h1 {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 0.2px;
    margin: 0;
  }
  h1 span { color: var(--text-secondary); font-weight: 500; }

  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-secondary);
    background: var(--surface);
    border: 1px solid #22282d;
    border-radius: 999px;
    padding: 6px 14px;
  }
