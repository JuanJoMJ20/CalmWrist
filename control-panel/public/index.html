<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CalmWrist — Panel de control</title>
<style>
  :root {
    --bg: #050607;
    --surface: #14181c;
    --surface-glow: #1b2124;
    --text-primary: #f5f7f8;
    --text-secondary: #a7b0b8;
    --danger: #ff6b57;
    --calm: #63e6cb;
    --elevated: #ffd166;
    --crisis: #ffb020;
    --calm-glow: #123832;
    --elevated-glow: #3a2e10;
    --crisis-glow: #3a2408;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(ellipse 900px 500px at 20% -10%, var(--calm-glow), transparent 60%),
      radial-gradient(ellipse 900px 500px at 100% 10%, var(--crisis-glow), transparent 60%),
      var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    padding: 28px 20px 60px;
  }

  .wrap { max-width: 880px; margin: 0 auto; }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 28px;
  }

  h1 {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 0.2px;
    margin: 0;
  }
  h1 span { color: var(--text-secondary); font-weight: 500; }

  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-secondary);
    background: var(--surface);
    border: 1px solid #22282d;
    border-radius: 999px;
    padding: 6px 14px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); transition: background 0.3s; }
  .dot.on { background: var(--calm); box-shadow: 0 0 8px var(--calm); }

  .connect-row { display: flex; gap: 8px; margin-bottom: 28px; }
  .connect-row input {
    flex: 1;
    background: var(--surface);
    border: 1px solid #22282d;
    color: var(--text-primary);
    border-radius: 999px;
    padding: 10px 16px;
    font-size: 13px;
    outline: none;
  }
  .connect-row input::placeholder { color: var(--text-secondary); }
  .connect-row input:focus { border-color: var(--calm); }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }

  .card {
    background: linear-gradient(165deg, var(--surface-glow), var(--surface));
    border: 1px solid #20262b;
    border-radius: 20px;
    padding: 20px;
  }
  .card h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--text-secondary);
    margin: 0 0 14px;
    font-weight: 700;
  }

  .band-row { display: flex; gap: 10px; flex-wrap: wrap; }

  .chip {
    appearance: none;
    border: none;
    border-radius: 999px;
    padding: 11px 18px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.3px;
    cursor: pointer;
    background: var(--surface);
    color: var(--text-primary);
    border: 1px solid #262c31;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    transition: transform 0.15s, box-shadow 0.2s, border-color 0.2s;
  }
  .chip:hover { transform: translateY(-1px); }
  .chip:active { transform: translateY(0); }
  .chip:disabled { opacity: 0.55; cursor: wait; transform: none; }

  .chip.calm { color: var(--calm); }
  .chip.elevated { color: var(--elevated); }
  .chip.crisis { color: var(--crisis); }
  .chip.danger { color: var(--danger); }

  .chip.active.calm { border-color: var(--calm); box-shadow: 0 0 14px -4px var(--calm); background: #0f2622; }
  .chip.active.elevated { border-color: var(--elevated); box-shadow: 0 0 14px -4px var(--elevated); background: #2a230c; }
  .chip.active.crisis { border-color: var(--crisis); box-shadow: 0 0 14px -4px var(--crisis); background: #2a1d08; }

  .chip.primary { background: var(--surface); }
  .chip.ghost { background: transparent; border: 1px solid #262c31; color: var(--text-secondary); font-weight: 500; }

  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row + .row { margin-top: 10px; }

  .ai-block { font-size: 13px; line-height: 1.5; margin-top: 4px; }
  .ai-block .label { display: flex; align-items: center; gap: 5px; color: var(--text-secondary); font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; margin-top: 10px; }
  .ai-block .value { color: var(--text-primary); }
  .ai-block .err { color: var(--danger); }
  .ai-block .ts { color: var(--text-secondary); font-size: 11px; margin-top: 2px; }
  .empty { color: var(--text-secondary); font-size: 13px; font-style: italic; }

  /* Señales de carga: todo proceso async (conectar, cambiar banda, llamar
     a Gemini) tiene que avisar que está en curso — nunca dejar al usuario
     sin feedback mientras espera una respuesta de red. */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    width: 13px;
    height: 13px;
    border-radius: 50%;
    border: 2px solid currentColor;
    border-top-color: transparent;
    opacity: 0.85;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }
  .loading-block {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text-secondary);
    font-size: 13px;
    padding: 6px 0;
  }
  .status-icon { display: inline-flex; flex-shrink: 0; }
  .status-icon.ok { color: var(--calm); }
  .status-icon.err { color: var(--danger); }

  .episodes-list { max-height: 160px; overflow-y: auto; font-size: 12.5px; }
  .episodes-list div { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #1d2227; color: var(--text-secondary); }
  .episodes-list div:last-child { border-bottom: none; }

  .danger-card { border-color: #3a2420; }
  .danger-card p { color: var(--text-secondary); font-size: 12.5px; margin: 0 0 14px; line-height: 1.5; }

  #log {
    margin-top: 20px;
    background: #0a0c0d;
    border: 1px solid #1d2227;
    border-radius: 14px;
    padding: 12px 16px;
    font-family: 'SFMono-Regular', Consolas, monospace;
    font-size: 11.5px;
    color: var(--text-secondary);
    max-height: 140px;
    overflow-y: auto;
    white-space: pre-wrap;
  }
  #log .ok { color: var(--calm); }
  #log .fail { color: var(--danger); }

  dialog {
    background: var(--surface);
    color: var(--text-primary);
    border: 1px solid #262c31;
    border-radius: 16px;
